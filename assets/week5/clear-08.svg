<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515"><rect width="1100" height="515" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">A scatterplot of beginning and current salary</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">When there is a single independent variable, the relationship between the</text><text x="84" y="159" font-size="23" fill="#22334a">independent variable and dependent variable can be visualized in a scatter</text><text x="84" y="193" font-size="23" fill="#22334a">plot.</text><text x="43" y="246" font-size="20" fill="#6d7890">2.</text><text x="84" y="246" font-size="23" fill="#22334a">Horizontal axis: Beginning Salary; visible ticks $0, $20,000, $40,000,</text><text x="84" y="280" font-size="23" fill="#22334a">$60,000, $80,000.</text><text x="43" y="333" font-size="20" fill="#6d7890">3.</text><text x="84" y="333" font-size="23" fill="#22334a">Vertical axis: Current Salary; visible ticks $0, $50,000, $100,000,</text><text x="84" y="367" font-size="23" fill="#22334a">$150,000.</text><text x="43" y="420" font-size="20" fill="#6d7890">4.</text><text x="84" y="420" font-size="23" fill="#22334a">The displayed points show an upward pattern around a fitted straight line.</text></g><text x="43" y="495" font-size="16" fill="#637087">Week 5 · PDF page 8 · clear reading view</text></g></svg>