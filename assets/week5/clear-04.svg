<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Simple linear regression: the equation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">A statistical procedure used to find relationships among a set of variables</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">In regression analysis, there is a dependent variable, the one you are</text><text x="84" y="212" font-size="23" fill="#22334a">trying to explain, and one or more independent variables related to it.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">You can express the relationship as a linear equation, such as: y = a + bx</text></g><text x="43" y="340" font-size="16" fill="#637087">Week 5 · PDF page 4 · clear reading view</text></g></svg>