<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="534" viewBox="0 0 1100 534"><rect width="1100" height="534" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Height and weight: an imperfect relationship</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Other relationships may not be so exact.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">Weight, for instance, is to some degree a function of height, but there are</text><text x="84" y="212" font-size="23" fill="#22334a">variations that height does not explain.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">On average, you might have an equation like: Weight = -222 + 5.7*Height</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">If you take a sample of actual heights and weights, you might see something</text><text x="84" y="352" font-size="23" fill="#22334a">like the graph to the right.</text><text x="43" y="405" font-size="20" fill="#6d7890">5.</text><text x="84" y="405" font-size="23" fill="#22334a">Scatterplot: horizontal axis Height, ticks 60, 65, 70, 75; vertical axis</text><text x="84" y="439" font-size="23" fill="#22334a">Weight, ticks 100, 120, 140, 160, 180, 200, 220.</text></g><text x="43" y="514" font-size="16" fill="#637087">Week 5 · PDF page 6 · clear reading view</text></g></svg>