<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="568" viewBox="0 0 1100 568"><rect width="1100" height="568" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">The unstandardized multiple-regression equation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">In multiple regression analysis, the independent variable (X) is known as</text><text x="84" y="159" font-size="23" fill="#22334a">the predictor variable whereas the dependent variable, which is teaching</text><text x="84" y="193" font-size="23" fill="#22334a">effectiveness, is known as the criterion variable (Ŷ).</text><text x="43" y="246" font-size="20" fill="#6d7890">2.</text><text x="84" y="246" font-size="23" fill="#22334a">The criterion variable score (Ŷ) is predicted using k predictor variables</text><text x="84" y="280" font-size="23" fill="#22334a">(X₁, X₂, .... and Xₖ), where k ≥ 2. The unstandardized multiple regression</text><text x="84" y="314" font-size="23" fill="#22334a">equation is shown below:</text><text x="43" y="367" font-size="20" fill="#6d7890">3.</text><text x="84" y="367" font-size="23" fill="#22334a">Ŷ = b₁X₁ + b₂X₂ + … + bₖXₖ + a</text><text x="43" y="420" font-size="20" fill="#6d7890">4.</text><text x="84" y="420" font-size="23" fill="#22334a">b = Regression coefficient for each predictor variable</text><text x="43" y="473" font-size="20" fill="#6d7890">5.</text><text x="84" y="473" font-size="23" fill="#22334a">a = Regression constant</text></g><text x="43" y="548" font-size="16" fill="#637087">Week 5 · PDF page 12 · clear reading view</text></g></svg>