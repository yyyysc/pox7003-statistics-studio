<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="659" viewBox="0 0 1100 659"><rect width="1100" height="659" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Intercept, slope and the phone-bill example</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">y is the dependent variable</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">x is the independent variable</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">a is a constant</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">b is the slope of the line</text><text x="43" y="337" font-size="20" fill="#6d7890">5.</text><text x="84" y="337" font-size="23" fill="#22334a">For every increase of 1 in x, y changes by an amount equal to b</text><text x="43" y="390" font-size="20" fill="#6d7890">6.</text><text x="84" y="390" font-size="23" fill="#22334a">Some relationships are perfectly linear and fit this equation exactly. Your</text><text x="84" y="424" font-size="23" fill="#22334a">cell phone bill, for instance, may be:</text><text x="43" y="477" font-size="20" fill="#6d7890">7.</text><text x="84" y="477" font-size="23" fill="#22334a">Total Charges = Base Fee + 30¢ (overage minutes)</text><text x="43" y="530" font-size="20" fill="#6d7890">8.</text><text x="84" y="530" font-size="23" fill="#22334a">If you know the base fee and the number of overage minutes, you can predict</text><text x="84" y="564" font-size="23" fill="#22334a">the total charges exactly.</text></g><text x="43" y="639" font-size="16" fill="#637087">Week 5 · PDF page 5 · clear reading view</text></g></svg>