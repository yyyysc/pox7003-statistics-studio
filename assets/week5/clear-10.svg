<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="462" viewBox="0 0 1100 462"><rect width="1100" height="462" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Multiple regression: five teaching-method scores</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The multiple regression test is used to identify change in two or more</text><text x="84" y="159" font-size="23" fill="#22334a">factors (IV) which contribute to change in a dependent variable.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">For example, a lecturer in the psychology department discovers that the</text><text x="84" y="246" font-size="23" fill="#22334a">psychology course tutors used five teaching methods in their tutorial</text><text x="84" y="280" font-size="23" fill="#22334a">sessions.</text><text x="43" y="333" font-size="20" fill="#6d7890">3.</text><text x="84" y="333" font-size="23" fill="#22334a">He wants to identify which method contributes most to teaching</text><text x="84" y="367" font-size="23" fill="#22334a">effectiveness.</text></g><text x="43" y="442" font-size="16" fill="#637087">Week 5 · PDF page 10 · clear reading view</text></g></svg>