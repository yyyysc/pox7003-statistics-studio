<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515"><rect width="1100" height="515" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">One-sample t-test: conditions</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The one-sample t-test is a statistical hypothesis test used to determine</text><text x="84" y="159" font-size="23" fill="#22334a">whether an unknown population mean is different from a specific value.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">You can use the test for continuous data. Your data should be a random</text><text x="84" y="246" font-size="23" fill="#22334a">sample from a normal population.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">If your sample sizes are very small, you might not be able to test for</text><text x="84" y="333" font-size="23" fill="#22334a">normality. You might need to rely on your understanding of the data.</text><text x="43" y="386" font-size="20" fill="#6d7890">4.</text><text x="84" y="386" font-size="23" fill="#22334a">When you cannot safely assume normality, you can perform a nonparametric</text><text x="84" y="420" font-size="23" fill="#22334a">test that doesn’t assume normality.</text></g><text x="43" y="495" font-size="16" fill="#637087">Week 3 · PDF page 21 · clear reading view</text></g></svg>