<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394"><rect width="1100" height="394" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Errors in hypothesis testing</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">In an ideal world, we would always reject the null hypothesis when it is</text><text x="84" y="159" font-size="23" fill="#22334a">false, and we would not reject the null hypothesis when it is indeed true.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">But two other scenarios are possible, each of which will result in an</text><text x="84" y="246" font-size="23" fill="#22334a">error.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Type I and Type II Errors</text></g><text x="43" y="374" font-size="16" fill="#637087">Week 3 · PDF page 14 · clear reading view</text></g></svg>