<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="602" viewBox="0 0 1100 602"><rect width="1100" height="602" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Type I and Type II: decision table</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><rect x="50" y="97" width="330.3333333333333" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="62" y="125" font-size="21" fill="#22334a">Decision</text><rect x="383.3333333333333" y="97" width="330.3333333333333" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="125" font-size="21" fill="#22334a">H₀ true</text><rect x="716.6666666666666" y="97" width="330.3333333333333" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="125" font-size="21" fill="#22334a">H₀ false</text><rect x="50" y="153" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="181" font-size="21" fill="#22334a">Fail to reject H₀</text><rect x="383.3333333333333" y="153" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="181" font-size="21" fill="#22334a">Correct</text><rect x="716.6666666666666" y="153" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="181" font-size="21" fill="#22334a">Type II error (β)</text><rect x="50" y="209" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="237" font-size="21" fill="#22334a">Reject H₀</text><rect x="383.3333333333333" y="209" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="237" font-size="21" fill="#22334a">Type I error (α)</text><rect x="716.6666666666666" y="209" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="237" font-size="21" fill="#22334a">Correct (power = 1−β)</text><text x="43" y="333" font-size="20" fill="#6d7890">1.</text><text x="84" y="333" font-size="23" fill="#22334a">Columns: H₀ True; H₀ False.</text><text x="43" y="386" font-size="20" fill="#6d7890">2.</text><text x="84" y="386" font-size="23" fill="#22334a">Accept H₀ / Reject H₁: True (if H₀ true); False: Type II error (if H₀</text><text x="84" y="420" font-size="23" fill="#22334a">false). [Original row labels]</text><text x="43" y="473" font-size="20" fill="#6d7890">3.</text><text x="84" y="473" font-size="23" fill="#22334a">Reject H₀ / Accept H₁: False: Type I error (if H₀ true); True (if H₀</text><text x="84" y="507" font-size="23" fill="#22334a">false). [Original row labels]</text></g><text x="43" y="582" font-size="16" fill="#637087">Week 3 · PDF page 18 · clear reading view</text></g></svg>