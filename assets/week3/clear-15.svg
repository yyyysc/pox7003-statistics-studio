<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="379" viewBox="0 0 1100 379"><rect width="1100" height="379" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Type I error</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Rejection of the null hypothesis that is actually true.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">Same as a “false positive”.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">The alpha value gives us the probability of a Type I error.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">For example, α = .05 = 5% chance of rejecting a true null hypothesis.</text></g><text x="43" y="359" font-size="16" fill="#637087">Week 3 · PDF page 15 · clear reading view</text></g></svg>