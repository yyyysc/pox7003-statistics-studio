<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="413" viewBox="0 0 1100 413"><rect width="1100" height="413" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Alpha level</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The value of alpha (α) is associated with the confidence level of our test;</text><text x="84" y="159" font-size="23" fill="#22334a">and significance level.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">For results with a 90% level of confidence, α = 1 − 0.90 = 0.10.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">For results with a 95% level of confidence, α = 1 − 0.95 = 0.05.</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">Typically set at 5% (.05) or 1% (.01).</text></g><text x="43" y="393" font-size="16" fill="#637087">Week 3 · PDF page 10 · clear reading view</text></g></svg>