<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="375" viewBox="0 0 1100 375"><rect width="1100" height="375" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Paired t-test</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The paired t-test is a method used to test whether the mean difference</text><text x="84" y="159" font-size="23" fill="#22334a">between pairs of measurements is zero or not.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The paired t-test is also known as the dependent samples t-test, the</text><text x="84" y="246" font-size="23" fill="#22334a">paired-difference t-test, the matched pairs t-test and the repeated-samples</text><text x="84" y="280" font-size="23" fill="#22334a">t-test.</text></g><text x="43" y="355" font-size="16" fill="#637087">Week 3 · PDF page 33 · clear reading view</text></g></svg>