<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="409" viewBox="0 0 1100 409"><rect width="1100" height="409" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Independent-samples t-test</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The two-sample t-test (also known as the independent samples t-test) is a</text><text x="84" y="159" font-size="23" fill="#22334a">method used to test whether the unknown population means of two groups are</text><text x="84" y="193" font-size="23" fill="#22334a">equal or not.</text><text x="43" y="246" font-size="20" fill="#6d7890">2.</text><text x="84" y="246" font-size="23" fill="#22334a">You can use the test when your data values are independent, are randomly</text><text x="84" y="280" font-size="23" fill="#22334a">sampled from two normal populations and the two independent groups have</text><text x="84" y="314" font-size="23" fill="#22334a">equal variances.</text></g><text x="43" y="389" font-size="16" fill="#637087">Week 3 · PDF page 27 · clear reading view</text></g></svg>