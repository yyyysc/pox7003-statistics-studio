<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Activity 1: energy-bar protein</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Imagine we have collected a random sample of 31 energy bars from a number</text><text x="84" y="159" font-size="23" fill="#22334a">of different stores to represent the population of energy bars available to</text><text x="84" y="193" font-size="23" fill="#22334a">the general consumer.</text><text x="43" y="246" font-size="20" fill="#6d7890">2.</text><text x="84" y="246" font-size="23" fill="#22334a">The labels on the bars claim that each bar contains 20 grams of protein.</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 3 · PDF page 23 · clear reading view</text></g></svg>