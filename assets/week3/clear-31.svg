<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="519" viewBox="0 0 1100 519"><rect width="1100" height="519" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-sample t formulas: pooled and Welch</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Is variance for two samples equal? Yes → pooled-variance t-test; No →</text><text x="84" y="159" font-size="23" fill="#22334a">unequal-variance t-test.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Equal variances: t=(x̄₁−x̄₂)/[sₚ√(1/n₁+1/n₂)].</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">sₚ²=[(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2).</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">Pooled-test df=n₁+n₂−2.</text><text x="43" y="371" font-size="20" fill="#6d7890">5.</text><text x="84" y="371" font-size="23" fill="#22334a">Unequal variances: t=(x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂).</text><text x="43" y="424" font-size="20" fill="#6d7890">6.</text><text x="84" y="424" font-size="23" fill="#22334a">Welch df=[s₁²/n₁+s₂²/n₂]² / {[(s₁²/n₁)²/(n₁−1)]+[(s₂²/n₂)²/(n₂−1)]}.</text></g><text x="43" y="499" font-size="16" fill="#637087">Week 3 · PDF page 31 · clear reading view</text></g></svg>