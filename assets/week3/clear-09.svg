<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Significance level</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Need to decide on a Significance Level.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">The probability that the test statistic will reject the null hypothesis</text><text x="84" y="212" font-size="23" fill="#22334a">when the null hypothesis is true.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">Significance is a property of the distribution of a test statistic, not of</text><text x="84" y="299" font-size="23" fill="#22334a">any particular draw of the statistic.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">Determines the Region of Rejection.</text><text x="43" y="405" font-size="20" fill="#6d7890">5.</text><text x="84" y="405" font-size="23" fill="#22334a">Generally 5% or 1%.</text></g><text x="43" y="480" font-size="16" fill="#637087">Week 3 · PDF page 9 · clear reading view</text></g></svg>