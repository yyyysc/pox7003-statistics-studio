<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Independent-samples assumptions</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Data values must be independent. Measurements for one observation do not</text><text x="84" y="159" font-size="23" fill="#22334a">affect measurements for any other observation.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Data in each group must be obtained via a random sample from the</text><text x="84" y="246" font-size="23" fill="#22334a">population.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Data in each group are normally distributed.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">Data values are continuous.</text><text x="43" y="405" font-size="20" fill="#6d7890">5.</text><text x="84" y="405" font-size="23" fill="#22334a">The variances for the two independent groups are equal.</text></g><text x="43" y="480" font-size="16" fill="#637087">Week 3 · PDF page 29 · clear reading view</text></g></svg>