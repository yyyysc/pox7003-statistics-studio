<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="413" viewBox="0 0 1100 413"><rect width="1100" height="413" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Type I error: drug example</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">H₀ = drug has no effect.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">H₁ = drug has an effect.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">Reject H₀ and instead claim H₁ is correct, so claim that the drug has an</text><text x="84" y="265" font-size="23" fill="#22334a">effect when indeed it does not.</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">Therefore the drug is falsely claimed to have an effect.</text></g><text x="43" y="393" font-size="16" fill="#637087">Week 3 · PDF page 16 · clear reading view</text></g></svg>