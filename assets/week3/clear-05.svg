<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="379" viewBox="0 0 1100 379"><rect width="1100" height="379" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Null hypothesis</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The case when the two groups are equal; population means are the same.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">Null Hypothesis = H₀</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">This is the hypothesis being tested.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">H₀ is assumed to be true.</text></g><text x="43" y="359" font-size="16" fill="#637087">Week 3 · PDF page 5 · clear reading view</text></g></svg>