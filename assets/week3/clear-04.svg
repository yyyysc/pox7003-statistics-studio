<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="447" viewBox="0 0 1100 447"><rect width="1100" height="447" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Statistical hypotheses</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Statements of circumstances in the population that the statistical process</text><text x="84" y="159" font-size="23" fill="#22334a">will examine and decide the likely truth or validity.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Statistical hypotheses are discussed in terms of the population, not the</text><text x="84" y="246" font-size="23" fill="#22334a">sample, yet tested on samples.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Based on the mathematical concept of probability.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">Null Hypothesis; Alternative Hypothesis</text></g><text x="43" y="427" font-size="16" fill="#637087">Week 3 · PDF page 4 · clear reading view</text></g></svg>