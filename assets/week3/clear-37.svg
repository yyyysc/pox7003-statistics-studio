<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="379" viewBox="0 0 1100 379"><rect width="1100" height="379" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Paired-test calculation steps</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">1. Calculate the mean score difference.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">2. Calculate the standard error for the score difference: s_d/√n.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">3. Calculate the test statistic: t = Average difference / Standard Error.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">4. Calculate degrees of freedom.</text></g><text x="43" y="359" font-size="16" fill="#637087">Week 3 · PDF page 37 · clear reading view</text></g></svg>