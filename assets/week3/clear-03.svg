<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Hypothesis testing</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Hypothesis testing is the key to our scientific inquiry.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">In addition to research hypotheses, need statistical hypotheses.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">Involves the statement of a null hypothesis, an alternative hypothesis, and</text><text x="84" y="265" font-size="23" fill="#22334a">the selection of a level of significance.</text></g><text x="43" y="340" font-size="16" fill="#637087">Week 3 · PDF page 3 · clear reading view</text></g></svg>