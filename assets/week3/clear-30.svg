<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="462" viewBox="0 0 1100 462"><rect width="1100" height="462" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Activity 2: body-fat percentages</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">One way to measure a person’s fitness is to measure their body fat</text><text x="84" y="159" font-size="23" fill="#22334a">percentage.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Average body fat percentages vary by age, but according to some guidelines,</text><text x="84" y="246" font-size="23" fill="#22334a">the normal range for men is 15–20% body fat, and the normal range for women</text><text x="84" y="280" font-size="23" fill="#22334a">is 20–25% body fat.</text><text x="43" y="333" font-size="20" fill="#6d7890">3.</text><text x="84" y="333" font-size="23" fill="#22334a">Our sample data is from a group of men and women who did workouts at a gym</text><text x="84" y="367" font-size="23" fill="#22334a">three times a week for a year. Then, their trainer measured the body fat.</text></g><text x="43" y="442" font-size="16" fill="#637087">Week 3 · PDF page 30 · clear reading view</text></g></svg>