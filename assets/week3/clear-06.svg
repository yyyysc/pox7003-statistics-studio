<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Alternative hypothesis</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The case when the two groups are not equal; when there is some treatment</text><text x="84" y="159" font-size="23" fill="#22334a">difference; when other possibilities exist.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Alternative Hypothesis = H₁ or Hₐ</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">H₁ is assumed to be true when the H₀ is false.</text></g><text x="43" y="340" font-size="16" fill="#637087">Week 3 · PDF page 6 · clear reading view</text></g></svg>