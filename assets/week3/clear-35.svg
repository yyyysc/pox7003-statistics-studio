<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="428" viewBox="0 0 1100 428"><rect width="1100" height="428" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Paired-test assumptions</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Subjects must be independent. Measurements for one subject do not affect</text><text x="84" y="159" font-size="23" fill="#22334a">measurements for any other subject.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Each of the paired measurements must be obtained from the same subject. For</text><text x="84" y="246" font-size="23" fill="#22334a">example, the before-and-after weight for a smoker must be from the same</text><text x="84" y="280" font-size="23" fill="#22334a">person.</text><text x="43" y="333" font-size="20" fill="#6d7890">3.</text><text x="84" y="333" font-size="23" fill="#22334a">The measured differences are normally distributed.</text></g><text x="43" y="408" font-size="16" fill="#637087">Week 3 · PDF page 35 · clear reading view</text></g></svg>