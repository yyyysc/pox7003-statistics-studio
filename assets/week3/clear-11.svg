<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="375" viewBox="0 0 1100 375"><rect width="1100" height="375" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">p-value: original wording and clarification</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The p-value, or calculated probability, is the estimated probability of</text><text x="84" y="159" font-size="23" fill="#22334a">rejecting the null hypothesis (H₀) of a study question when that hypothesis</text><text x="84" y="193" font-size="23" fill="#22334a">is true. [Original wording]</text><text x="43" y="246" font-size="20" fill="#6d7890">2.</text><text x="84" y="246" font-size="23" fill="#22334a">Probability that the observed statistic occurred by chance alone. [Original</text><text x="84" y="280" font-size="23" fill="#22334a">wording]</text></g><text x="43" y="355" font-size="16" fill="#637087">Week 3 · PDF page 11 · clear reading view</text></g></svg>