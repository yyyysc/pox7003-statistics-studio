<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="466" viewBox="0 0 1100 466"><rect width="1100" height="466" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Interpreting skewness and introducing kurtosis</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">If s³ &lt; 0, the distribution has a negative skew.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">If s³ &gt; 0, the distribution has a positive skew.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">If s³ = 0, the distribution is symmetrical. [original claim]</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">The more different s³ is from 0, the greater the skew in the distribution.</text><text x="43" y="337" font-size="20" fill="#6d7890">5.</text><text x="84" y="337" font-size="23" fill="#22334a">Kurtosis measures whether the scores are spread out more or less than in a</text><text x="84" y="371" font-size="23" fill="#22334a">normal (Gaussian) distribution. [original wording]</text></g><text x="43" y="446" font-size="16" fill="#637087">Week 2 · PDF page 22 · clear reading view</text></g></svg>