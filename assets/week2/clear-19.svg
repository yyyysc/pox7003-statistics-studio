<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565"><rect width="1100" height="565" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Population and sample SD</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><rect x="50" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="62" y="125" font-size="21" fill="#22334a">Population</text><rect x="550" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="562" y="125" font-size="21" fill="#22334a">Sample</text><rect x="50" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="181" font-size="21" fill="#22334a">σ = √[Σ(X−μ)²/N]</text><rect x="550" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="181" font-size="21" fill="#22334a">s = √[Σ(X−X̄)²/(n−1)]</text><text x="43" y="277" font-size="20" fill="#6d7890">1.</text><text x="84" y="277" font-size="23" fill="#22334a">Population: σ = √[Σ(X − μ)²/N]</text><text x="43" y="330" font-size="20" fill="#6d7890">2.</text><text x="84" y="330" font-size="23" fill="#22334a">Sample: s = √[Σ(X − X̄)²/(n−1)]</text><text x="43" y="383" font-size="20" fill="#6d7890">3.</text><text x="84" y="383" font-size="23" fill="#22334a">X: value in the data distribution; μ: population mean; X̄: sample mean;</text><text x="84" y="417" font-size="23" fill="#22334a">N/n: number of observations.</text><text x="43" y="470" font-size="20" fill="#6d7890">4.</text><text x="84" y="470" font-size="23" fill="#22334a">Measure of Skew</text></g><text x="43" y="545" font-size="16" fill="#637087">Week 2 · PDF page 19 · clear reading view</text></g></svg>