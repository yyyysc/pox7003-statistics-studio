<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394"><rect width="1100" height="394" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Kurtosis categories</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Mesokurtic (s⁴ = 3); Leptokurtic (s⁴ &gt; 3); Platykurtic (s⁴ &lt; 3)</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">When the distribution is normally distributed, its kurtosis equals 3 and it</text><text x="84" y="212" font-size="23" fill="#22334a">is said to be mesokurtic.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">When the distribution is less spread out than normal, its kurtosis is</text><text x="84" y="299" font-size="23" fill="#22334a">greater than 3 and it is said to be leptokurtic. [original wording]</text></g><text x="43" y="374" font-size="16" fill="#637087">Week 2 · PDF page 23 · clear reading view</text></g></svg>