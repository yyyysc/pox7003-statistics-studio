<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="568" viewBox="0 0 1100 568"><rect width="1100" height="568" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Measures of dispersion</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Measures of dispersion are descriptive statistics that describe how similar</text><text x="84" y="159" font-size="23" fill="#22334a">a set of scores are to each other.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The more similar the scores are to each other, the lower the measure of</text><text x="84" y="246" font-size="23" fill="#22334a">dispersion will be.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">The less similar the scores are to each other, the higher the measure of</text><text x="84" y="333" font-size="23" fill="#22334a">dispersion will be.</text><text x="43" y="386" font-size="20" fill="#6d7890">4.</text><text x="84" y="386" font-size="23" fill="#22334a">In general, the more spread out a distribution is, the larger the measure</text><text x="84" y="420" font-size="23" fill="#22334a">of dispersion will be.</text><text x="43" y="473" font-size="20" fill="#6d7890">5.</text><text x="84" y="473" font-size="23" fill="#22334a">Which of the distributions of scores has the larger dispersion?</text></g><text x="43" y="548" font-size="16" fill="#637087">Week 2 · PDF page 2 · clear reading view</text></g></svg>