<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="534" viewBox="0 0 1100 534"><rect width="1100" height="534" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Range: answer, use and limitations</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The largest score (Xₗ) is 9; the smallest score (Xₛ) is 1; the range is Xₗ</text><text x="84" y="159" font-size="23" fill="#22334a">− Xₛ = 9 − 1 = 8.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The range is used when you have ordinal data or you are presenting your</text><text x="84" y="246" font-size="23" fill="#22334a">results to people with little or no knowledge of statistics.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">The range is rarely used in scientific work as it is fairly insensitive.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">It depends on only two scores in the set of data, Xₗ and Xₛ.</text><text x="43" y="405" font-size="20" fill="#6d7890">5.</text><text x="84" y="405" font-size="23" fill="#22334a">Two very different sets of data can have the same range: 1,1,1,1,9 vs</text><text x="84" y="439" font-size="23" fill="#22334a">1,3,5,7,9.</text></g><text x="43" y="514" font-size="16" fill="#637087">Week 2 · PDF page 4 · clear reading view</text></g></svg>