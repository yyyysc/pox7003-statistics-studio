<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="307" viewBox="0 0 1100 307"><rect width="1100" height="307" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Range: definition and question</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The range is defined as the difference between the largest score in the set</text><text x="84" y="159" font-size="23" fill="#22334a">of data and the smallest score in the set of data, Xₗ − Xₛ.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">What is the range of the following data: 4, 8, 1, 6, 6, 2, 9, 3, 6, 9?</text></g><text x="43" y="287" font-size="16" fill="#637087">Week 2 · PDF page 3 · clear reading view</text></g></svg>