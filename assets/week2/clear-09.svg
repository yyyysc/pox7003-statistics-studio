<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="413" viewBox="0 0 1100 413"><rect width="1100" height="413" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Understanding a deviation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">First, subtract the mean from each of the scores.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">This difference is called a deviate or a deviation score.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">The deviate tells us how far a given score is from the typical, or average,</text><text x="84" y="265" font-size="23" fill="#22334a">score.</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">Thus, the deviate is a measure of dispersion for a given score.</text></g><text x="43" y="393" font-size="16" fill="#637087">Week 2 · PDF page 9 · clear reading view</text></g></svg>