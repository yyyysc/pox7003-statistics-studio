<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="447" viewBox="0 0 1100 447"><rect width="1100" height="447" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Standard deviation formula and clustered example</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">s = √[Σ(Xᵢ − X̄)² / n] [displayed formula; the slide notes the denominator</text><text x="84" y="159" font-size="23" fill="#22334a">correction]</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">We usually use n−1 in the denominator.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">Examples of standard deviation: s = 1.67; Clustered distribution.</text><text x="43" y="318" font-size="20" fill="#6d7890">4.</text><text x="84" y="318" font-size="23" fill="#22334a">Most children perform to a similar level, with some variation. [continues</text><text x="84" y="352" font-size="23" fill="#22334a">next page]</text></g><text x="43" y="427" font-size="16" fill="#637087">Week 2 · PDF page 17 · clear reading view</text></g></svg>