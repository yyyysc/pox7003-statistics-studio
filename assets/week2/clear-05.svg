<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Interquartile range</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Divide the distribution into four equal parts.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">Q1, Q2, Q3</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">The interquartile range is defined as the distance between the first</text><text x="84" y="265" font-size="23" fill="#22334a">quartile and the third quartile.</text></g><text x="43" y="340" font-size="16" fill="#637087">Week 2 · PDF page 5 · clear reading view</text></g></svg>