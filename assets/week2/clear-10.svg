<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="447" viewBox="0 0 1100 447"><rect width="1100" height="447" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Interpreting variance</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Variance is the mean of the squared deviation scores.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">The larger the variance is, the more the scores deviate, on average, away</text><text x="84" y="212" font-size="23" fill="#22334a">from the mean.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">The smaller the variance is, the less the scores deviate, on average, from</text><text x="84" y="299" font-size="23" fill="#22334a">the mean.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">Standard Deviation</text></g><text x="43" y="427" font-size="16" fill="#637087">Week 2 · PDF page 10 · clear reading view</text></g></svg>