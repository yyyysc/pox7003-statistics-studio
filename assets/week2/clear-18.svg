<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="764" viewBox="0 0 1100 764"><rect width="1100" height="764" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Comparing standard deviations</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><rect x="50" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="62" y="125" font-size="21" fill="#22334a">Distribution</text><rect x="550" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="562" y="125" font-size="21" fill="#22334a">SD</text><rect x="50" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="181" font-size="21" fill="#22334a">Tight</text><rect x="550" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="181" font-size="21" fill="#22334a">1.02</text><rect x="50" y="209" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="237" font-size="21" fill="#22334a">Clustered</text><rect x="550" y="209" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="237" font-size="21" fill="#22334a">1.67</text><rect x="50" y="265" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="293" font-size="21" fill="#22334a">Dispersed</text><rect x="550" y="265" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="293" font-size="21" fill="#22334a">4.01</text><text x="43" y="389" font-size="20" fill="#6d7890">1.</text><text x="84" y="389" font-size="23" fill="#22334a">s = 4.01: Dispersed distribution.</text><text x="43" y="442" font-size="20" fill="#6d7890">2.</text><text x="84" y="442" font-size="23" fill="#22334a">“One group of geniuses, one group of idiots” [original illustration</text><text x="84" y="476" font-size="23" fill="#22334a">wording]</text><text x="43" y="529" font-size="20" fill="#6d7890">3.</text><text x="84" y="529" font-size="23" fill="#22334a">s = 1.02: Tight distribution; all children perform similarly.</text><text x="43" y="582" font-size="20" fill="#6d7890">4.</text><text x="84" y="582" font-size="23" fill="#22334a">High levels of s indicate greater variation; s gives a broad idea of a</text><text x="84" y="616" font-size="23" fill="#22334a">typical distance from the mean.</text><text x="43" y="669" font-size="20" fill="#6d7890">5.</text><text x="84" y="669" font-size="23" fill="#22334a">The concept of standard deviation is an important one.</text></g><text x="43" y="744" font-size="16" fill="#637087">Week 2 · PDF page 18 · clear reading view</text></g></svg>