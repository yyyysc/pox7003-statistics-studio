<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="568" viewBox="0 0 1100 568"><rect width="1100" height="568" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Squared units and standard deviation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">When the deviate scores are squared in variance, their unit of measure is</text><text x="84" y="159" font-size="23" fill="#22334a">squared as well.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">If people’s weights are measured in pounds, the variance is expressed in</text><text x="84" y="246" font-size="23" fill="#22334a">pounds² (squared pounds).</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Since squared units are often awkward, the square root of variance is often</text><text x="84" y="333" font-size="23" fill="#22334a">used instead.</text><text x="43" y="386" font-size="20" fill="#6d7890">4.</text><text x="84" y="386" font-size="23" fill="#22334a">The standard deviation is the square root of variance.</text><text x="43" y="439" font-size="20" fill="#6d7890">5.</text><text x="84" y="439" font-size="23" fill="#22334a">When calculating variance, it is often easier to use an algebraically</text><text x="84" y="473" font-size="23" fill="#22334a">equivalent computational formula.</text></g><text x="43" y="548" font-size="16" fill="#637087">Week 2 · PDF page 11 · clear reading view</text></g></svg>