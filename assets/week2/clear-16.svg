<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="428" viewBox="0 0 1100 428"><rect width="1100" height="428" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Calculating standard deviation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">s² is the sample variance; X is a score; X̄ is the sample mean; N is the</text><text x="84" y="159" font-size="23" fill="#22334a">number of scores.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The standard deviation is the most common way to measure deviation from the</text><text x="84" y="246" font-size="23" fill="#22334a">mean and is simply the square root of the variance.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">We normally call the variance s² and the standard deviation s. For our</text><text x="84" y="333" font-size="23" fill="#22334a">example, s² = 507.2 and s = 22.5.</text></g><text x="43" y="408" font-size="16" fill="#637087">Week 2 · PDF page 16 · clear reading view</text></g></svg>