<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394"><rect width="1100" height="394" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Variables and independent variable</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">A variable is any factor that can change in a scientific environment or</text><text x="84" y="159" font-size="23" fill="#22334a">experiment.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Types of variable: Independent variable (IV); Dependent variable (DV);</text><text x="84" y="246" font-size="23" fill="#22334a">Controlled variable.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Independent Variable</text></g><text x="43" y="374" font-size="16" fill="#637087">Week 2 · PDF page 32 · clear reading view</text></g></svg>