<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394"><rect width="1100" height="394" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-way assumptions within each cell</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">There should be no significant outliers.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">The dependent variable should be approximately normally distributed for</text><text x="84" y="212" font-size="23" fill="#22334a">each combination of groups of the two independent variables.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">There needs to be homogeneity of variances for each combination of groups</text><text x="84" y="299" font-size="23" fill="#22334a">of the two independent variables.</text></g><text x="43" y="374" font-size="16" fill="#637087">Week 6 · PDF page 13 · clear reading view</text></g></svg>