<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394"><rect width="1100" height="394" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">ANOVA: purpose</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The ANOVA test (analysis of variances test) is widely used in behavioral</text><text x="84" y="159" font-size="23" fill="#22334a">sciences studies.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">It is used to differentiate the mean scores of the research samples.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">Unlike the t-test which allows the comparison between only two mean scores,</text><text x="84" y="299" font-size="23" fill="#22334a">the ANOVA test can be used to compare two, three, five or n mean scores.</text></g><text x="43" y="374" font-size="16" fill="#637087">Week 6 · PDF page 3 · clear reading view</text></g></svg>