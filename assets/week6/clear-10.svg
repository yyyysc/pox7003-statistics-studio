<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-way assumption: outcome scale</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The dependent variable should be measured at the continuous level (interval</text><text x="84" y="159" font-size="23" fill="#22334a">or ratio).</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Examples: revision time in hours, IQ score, exam performance from 0 to 100,</text><text x="84" y="246" font-size="23" fill="#22334a">weight in kg.</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 6 · PDF page 10 · clear reading view</text></g></svg>