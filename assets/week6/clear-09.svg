<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="428" viewBox="0 0 1100 428"><rect width="1100" height="428" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-way ANOVA and interaction</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The primary purpose of a two-way ANOVA is to understand whether there is an</text><text x="84" y="159" font-size="23" fill="#22334a">interaction between two independent variables on the dependent variable.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Example: interaction between gender and educational level on test anxiety</text><text x="84" y="246" font-size="23" fill="#22334a">amongst university students.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">Gender (males/females) and education level (undergraduate/postgraduate) are</text><text x="84" y="333" font-size="23" fill="#22334a">the independent variables; test anxiety is the dependent variable.</text></g><text x="43" y="408" font-size="16" fill="#637087">Week 6 · PDF page 9 · clear reading view</text></g></svg>