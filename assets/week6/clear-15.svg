<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="692" viewBox="0 0 1100 692"><rect width="1100" height="692" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Example: decisions on main effects and interaction</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><rect x="50" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="62" y="125" font-size="21" fill="#22334a">Term</text><rect x="550" y="97" width="497" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="562" y="125" font-size="21" fill="#22334a">Decision</text><rect x="50" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="181" font-size="21" fill="#22334a">Gender main effect</text><rect x="550" y="153" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="181" font-size="21" fill="#22334a">Reject H₀</text><rect x="50" y="209" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="237" font-size="21" fill="#22334a">Age main effect</text><rect x="550" y="209" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="237" font-size="21" fill="#22334a">Reject H₀</text><rect x="50" y="265" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="293" font-size="21" fill="#22334a">Gender × Age</text><rect x="550" y="265" width="497" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="293" font-size="21" fill="#22334a">Fail to reject H₀</text><text x="43" y="389" font-size="20" fill="#6d7890">1.</text><text x="84" y="389" font-size="23" fill="#22334a">REJECT H₀: Gender will have no significant effect on students’ score. H₁:</text><text x="84" y="423" font-size="23" fill="#22334a">Gender does have a significant effect.</text><text x="43" y="476" font-size="20" fill="#6d7890">2.</text><text x="84" y="476" font-size="23" fill="#22334a">REJECT H₀: Age will have no significant effect on students’ score. H₁: Age</text><text x="84" y="510" font-size="23" fill="#22334a">has a significant effect.</text><text x="43" y="563" font-size="20" fill="#6d7890">3.</text><text x="84" y="563" font-size="23" fill="#22334a">FAIL TO REJECT H₀: Gender and Age interaction will have no significant</text><text x="84" y="597" font-size="23" fill="#22334a">effect on students’ score.</text></g><text x="43" y="672" font-size="16" fill="#637087">Week 6 · PDF page 15 · clear reading view</text></g></svg>