<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="428" viewBox="0 0 1100 428"><rect width="1100" height="428" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">One-way assumption: observations are independent</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">There should be independence of observations: no relationship between</text><text x="84" y="159" font-size="23" fill="#22334a">observations within each group or between groups.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">There must be different participants in each group, with no participant</text><text x="84" y="246" font-size="23" fill="#22334a">being in more than one group.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">This is more of a study-design issue than something you can test for, but</text><text x="84" y="333" font-size="23" fill="#22334a">it is an important one-way ANOVA assumption.</text></g><text x="43" y="408" font-size="16" fill="#637087">Week 6 · PDF page 6 · clear reading view</text></g></svg>