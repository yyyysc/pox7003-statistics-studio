<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-way assumption: two categorical factors</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Two independent variables should each consist of two or more categorical,</text><text x="84" y="159" font-size="23" fill="#22334a">independent groups.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Examples: gender (male/female), ethnicity (Caucasian/African</text><text x="84" y="246" font-size="23" fill="#22334a">American/Hispanic), profession (surgeon/doctor/nurse/dentist/therapist).</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 6 · PDF page 11 · clear reading view</text></g></svg>