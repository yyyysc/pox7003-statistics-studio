<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="496" viewBox="0 0 1100 496"><rect width="1100" height="496" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">One-way assumption: independent groups</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The independent variable should consist of two or more categorical,</text><text x="84" y="159" font-size="23" fill="#22334a">independent groups.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Typically, a one-way ANOVA is used with three or more categorical</text><text x="84" y="246" font-size="23" fill="#22334a">independent groups, but it can be used for just two groups; an</text><text x="84" y="280" font-size="23" fill="#22334a">independent-samples t-test is more commonly used for two.</text><text x="43" y="333" font-size="20" fill="#6d7890">3.</text><text x="84" y="333" font-size="23" fill="#22334a">Examples: ethnicity (Caucasian, African American, Hispanic); physical</text><text x="84" y="367" font-size="23" fill="#22334a">activity (sedentary, low, moderate, high); profession (surgeon, doctor,</text><text x="84" y="401" font-size="23" fill="#22334a">nurse, dentist, therapist).</text></g><text x="43" y="476" font-size="16" fill="#637087">Week 6 · PDF page 5 · clear reading view</text></g></svg>