<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="307" viewBox="0 0 1100 307"><rect width="1100" height="307" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Two-way assumption: independent observations</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">There should be independence of observations within and between groups.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">There must be different participants in each group and no participant in</text><text x="84" y="212" font-size="23" fill="#22334a">more than one group.</text></g><text x="43" y="287" font-size="16" fill="#637087">Week 6 · PDF page 12 · clear reading view</text></g></svg>