<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Why use correlational research? Understanding</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Major purpose: to explain clearly our understanding through identifying</text><text x="84" y="159" font-size="23" fill="#22334a">relationships among variables.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Where experimental researches are difficult, correlational research can</text><text x="84" y="246" font-size="23" fill="#22334a">still explain some important phenomena.</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 4 · PDF page 17 · clear reading view</text></g></svg>