<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="481" viewBox="0 0 1100 481"><rect width="1100" height="481" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Correlational study</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">The researchers investigate the possible relationship among variables</text><text x="84" y="159" font-size="23" fill="#22334a">without influencing those variables.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">Can describe the existing relationship between variables.</text><text x="43" y="265" font-size="20" fill="#6d7890">3.</text><text x="84" y="265" font-size="23" fill="#22334a">Describes the degree to which two or more quantitative variables are</text><text x="84" y="299" font-size="23" fill="#22334a">related.</text><text x="43" y="352" font-size="20" fill="#6d7890">4.</text><text x="84" y="352" font-size="23" fill="#22334a">When a correlation exists between two variables, denoted by r, scores on</text><text x="84" y="386" font-size="23" fill="#22334a">one variable are associated with scores on the other variable.</text></g><text x="43" y="461" font-size="16" fill="#637087">Week 4 · PDF page 3 · clear reading view</text></g></svg>