<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Design of a correlational relationship</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Only one group is used.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">Two measures are made.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">These two measures are correlated.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">The intent is to determine the degree of relationship that exists between</text><text x="84" y="318" font-size="23" fill="#22334a">the two measured variables.</text><text x="43" y="371" font-size="20" fill="#6d7890">5.</text><text x="84" y="371" font-size="23" fill="#22334a">The researcher can generalize his/her findings on the relationship if a</text><text x="84" y="405" font-size="23" fill="#22334a">sample is randomly assigned and the loss of subjects is minimal.</text></g><text x="43" y="480" font-size="16" fill="#637087">Week 4 · PDF page 16 · clear reading view</text></g></svg>