<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="485" viewBox="0 0 1100 485"><rect width="1100" height="485" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Manual calculation of Pearson r</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">r = Σ[(xᵢ − x̄)(yᵢ − ȳ)] / √[Σ(xᵢ − x̄)² × Σ(yᵢ − ȳ)²]</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">r = correlation coefficient.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">xᵢ = values of the x-variable in a sample.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">x̄ = mean of the values of the x-variable.</text><text x="43" y="337" font-size="20" fill="#6d7890">5.</text><text x="84" y="337" font-size="23" fill="#22334a">yᵢ = values of the y-variable in a sample.</text><text x="43" y="390" font-size="20" fill="#6d7890">6.</text><text x="84" y="390" font-size="23" fill="#22334a">ȳ = mean of the values of the y-variable.</text></g><text x="43" y="465" font-size="16" fill="#637087">Week 4 · PDF page 22 · clear reading view</text></g></svg>