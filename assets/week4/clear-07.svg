<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="591" viewBox="0 0 1100 591"><rect width="1100" height="591" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Scatterplots and correlation coefficients</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Scatter Plots and Correlation Coefficients</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">(a) r = 1: perfect positive correlation.</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">(b) r ≈ 0.8: strong positive correlation.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">(c) r ≈ 0.3: moderate to weak positive correlation.</text><text x="43" y="337" font-size="20" fill="#6d7890">5.</text><text x="84" y="337" font-size="23" fill="#22334a">(d) r = 0: no correlation.</text><text x="43" y="390" font-size="20" fill="#6d7890">6.</text><text x="84" y="390" font-size="23" fill="#22334a">(e) r ≈ −0.3: moderate to weak negative correlation.</text><text x="43" y="443" font-size="20" fill="#6d7890">7.</text><text x="84" y="443" font-size="23" fill="#22334a">(f) r ≈ −0.8: strong negative correlation.</text><text x="43" y="496" font-size="20" fill="#6d7890">8.</text><text x="84" y="496" font-size="23" fill="#22334a">(g) r = −1: perfect negative correlation.</text></g><text x="43" y="571" font-size="16" fill="#637087">Week 4 · PDF page 7 · clear reading view</text></g></svg>