<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Why use correlational research? Prediction</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Second purpose: is that of prediction.</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">If a relationship of sufficient magnitude exists between two variables, it</text><text x="84" y="212" font-size="23" fill="#22334a">becomes possible to predict a score on either variable if a score on the</text><text x="84" y="246" font-size="23" fill="#22334a">other variable is known.</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 4 · PDF page 18 · clear reading view</text></g></svg>