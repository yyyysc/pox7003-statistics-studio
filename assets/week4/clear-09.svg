<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1116" viewBox="0 0 1100 1116"><rect width="1100" height="1116" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Correlation measures and measurement scales</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><rect x="50" y="97" width="247" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="62" y="125" font-size="21" fill="#22334a">Y / X</text><rect x="300" y="97" width="247" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="312" y="125" font-size="21" fill="#22334a">Nominal</text><rect x="550" y="97" width="247" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="562" y="125" font-size="21" fill="#22334a">Ordinal</text><rect x="800" y="97" width="247" height="53" rx="6" fill="#e1e7fa" stroke="#c7d1e2"/><text x="812" y="125" font-size="21" fill="#22334a">Interval / ratio</text><rect x="50" y="153" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="181" font-size="21" fill="#22334a">Nominal</text><rect x="300" y="153" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="312" y="181" font-size="21" fill="#22334a">Cramér’s V; Phi;</text><text x="312" y="210" font-size="21" fill="#22334a">Lambda</text><rect x="550" y="153" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="181" font-size="21" fill="#22334a">Rank-biserial</text><rect x="800" y="153" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="812" y="181" font-size="21" fill="#22334a">Point-biserial</text><rect x="50" y="238" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="266" font-size="21" fill="#22334a">Ordinal</text><rect x="300" y="238" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="312" y="266" font-size="21" fill="#22334a">Rank-biserial</text><rect x="550" y="238" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="266" font-size="21" fill="#22334a">Spearman; Tetrachoric</text><text x="562" y="295" font-size="21" fill="#22334a">[original]</text><rect x="800" y="238" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="812" y="266" font-size="21" fill="#22334a">Biserial [original]</text><rect x="50" y="323" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="351" font-size="21" fill="#22334a">Interval / ratio</text><rect x="300" y="323" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="312" y="351" font-size="21" fill="#22334a">Point-biserial</text><rect x="550" y="323" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="562" y="351" font-size="21" fill="#22334a">Biserial [original]</text><rect x="800" y="323" width="247" height="82" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="812" y="351" font-size="21" fill="#22334a">Pearson</text><text x="812" y="380" font-size="21" fill="#22334a">product-moment</text><text x="43" y="476" font-size="20" fill="#6d7890">1.</text><text x="84" y="476" font-size="23" fill="#22334a">Variable X: Nominal; Ordinal; Interval or ratio. Variable Y: Nominal;</text><text x="84" y="510" font-size="23" fill="#22334a">Ordinal; Interval or ratio.</text><text x="43" y="563" font-size="20" fill="#6d7890">2.</text><text x="84" y="563" font-size="23" fill="#22334a">Y Nominal × X Nominal: 1. Cramer’s V; 2. Phi; 3. Lambda.</text><text x="43" y="616" font-size="20" fill="#6d7890">3.</text><text x="84" y="616" font-size="23" fill="#22334a">Y Nominal × X Ordinal: Rank-biserial.</text><text x="43" y="669" font-size="20" fill="#6d7890">4.</text><text x="84" y="669" font-size="23" fill="#22334a">Y Nominal × X Interval or ratio: Point-biserial.</text><text x="43" y="722" font-size="20" fill="#6d7890">5.</text><text x="84" y="722" font-size="23" fill="#22334a">Y Ordinal × X Nominal: Rank-biserial.</text><text x="43" y="775" font-size="20" fill="#6d7890">6.</text><text x="84" y="775" font-size="23" fill="#22334a">Y Ordinal × X Ordinal: 1. Spearman’s rho; 2. Tetrachoric.</text><text x="43" y="828" font-size="20" fill="#6d7890">7.</text><text x="84" y="828" font-size="23" fill="#22334a">Y Ordinal × X Interval or ratio: Biserial.</text><text x="43" y="881" font-size="20" fill="#6d7890">8.</text><text x="84" y="881" font-size="23" fill="#22334a">Y Interval or ratio × X Nominal: Point-biserial.</text><text x="43" y="934" font-size="20" fill="#6d7890">9.</text><text x="84" y="934" font-size="23" fill="#22334a">Y Interval or ratio × X Ordinal: Biserial.</text><text x="43" y="987" font-size="20" fill="#6d7890">10.</text><text x="84" y="987" font-size="23" fill="#22334a">Y Interval or ratio × X Interval or ratio: Pearson product-moment (Pearson</text><text x="84" y="1021" font-size="23" fill="#22334a">correlation test).</text></g><text x="43" y="1096" font-size="16" fill="#637087">Week 4 · PDF page 9 · clear reading view</text></g></svg>