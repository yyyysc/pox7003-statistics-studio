<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="795" viewBox="0 0 1100 795"><rect width="1100" height="795" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Pearson variables and a prediction equation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Variable 1: Interval or ratio scale ↔ Pearson correlation test ↔ Variable</text><text x="84" y="159" font-size="23" fill="#22334a">2: Interval or ratio scale.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The basis for determining the relationship equation between variables is by</text><text x="84" y="246" font-size="23" fill="#22334a">stating its general equation.</text><text x="43" y="299" font-size="20" fill="#6d7890">3.</text><text x="84" y="299" font-size="23" fill="#22334a">The general equation for the relationship between variables is represented</text><text x="84" y="333" font-size="23" fill="#22334a">by the following formula.</text><text x="43" y="386" font-size="20" fill="#6d7890">4.</text><text x="84" y="386" font-size="23" fill="#22334a">In calculating the relationship, one variable is treated as the dependent</text><text x="84" y="420" font-size="23" fill="#22334a">variable and the other as the independent variable.</text><text x="43" y="473" font-size="20" fill="#6d7890">5.</text><text x="84" y="473" font-size="23" fill="#22334a">Y = a + bX</text><text x="43" y="526" font-size="20" fill="#6d7890">6.</text><text x="84" y="526" font-size="23" fill="#22334a">Y = Dependent variable; X = Independent variable.</text><text x="43" y="579" font-size="20" fill="#6d7890">7.</text><text x="84" y="579" font-size="23" fill="#22334a">a = The constant value of the crossing point of the linear regression line</text><text x="84" y="613" font-size="23" fill="#22334a">at the Y axis.</text><text x="43" y="666" font-size="20" fill="#6d7890">8.</text><text x="84" y="666" font-size="23" fill="#22334a">b = The regression line gradient which states the relationship between the</text><text x="84" y="700" font-size="23" fill="#22334a">variables.</text></g><text x="43" y="775" font-size="16" fill="#637087">Week 4 · PDF page 12 · clear reading view</text></g></svg>