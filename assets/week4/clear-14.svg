<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="288" viewBox="0 0 1100 288"><rect width="1100" height="288" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Negative correlation</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">A negative correlation means high scores on one variable tend to be</text><text x="84" y="159" font-size="23" fill="#22334a">associated with low scores on the other, &amp; low scores on one are associated</text><text x="84" y="193" font-size="23" fill="#22334a">with high scores on the other.</text></g><text x="43" y="268" font-size="16" fill="#637087">Week 4 · PDF page 14 · clear reading view</text></g></svg>