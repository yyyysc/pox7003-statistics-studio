xt><rect x="50" y="265" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="293" font-size="21" fill="#22334a">IQ: N</text><rect x="383.3333333333333" y="265" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="293" font-size="21" fill="#22334a">10</text><rect x="716.6666666666666" y="265" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="293" font-size="21" fill="#22334a">10</text><rect x="50" y="321" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="349" font-size="21" fill="#22334a">Maths: Pearson correlation</text><rect x="383.3333333333333" y="321" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="349" font-size="21" fill="#22334a">.719*</text><rect x="716.6666666666666" y="321" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="349" font-size="21" fill="#22334a">1</text><rect x="50" y="377" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="405" font-size="21" fill="#22334a">Maths: Sig. (2-tailed)</text><rect x="383.3333333333333" y="377" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="405" font-size="21" fill="#22334a">.019</text><rect x="716.6666666666666" y="377" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="405" font-size="21" fill="#22334a">—</text><rect x="50" y="433" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="62" y="461" font-size="21" fill="#22334a">Maths: N</text><rect x="383.3333333333333" y="433" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="395.3333333333333" y="461" font-size="21" fill="#22334a">10</text><rect x="716.6666666666666" y="433" width="330.3333333333333" height="53" rx="6" fill="#f1f4fa" stroke="#c7d1e2"/><text x="728.6666666666666" y="461" font-size="21" fill="#22334a">10</text><text x="43" y="557" font-size="20" fill="#6d7890">1.</text><text x="84" y="557" font-size="23" fill="#22334a">Correlations: IQ × IQ = 1; Maths × Maths = 1.</text><text x="43" y="610" font-size="20" fill="#6d7890">2.</text><text x="84" y="610" font-size="23" fill="#22334a">IQ × Maths: Pearson Correlation = .719*.</text><text x="43" y="663" font-size="20" fill="#6d7890">3.</text><text x="84" y="663" font-size="23" fill="#22334a">IQ × Maths: Sig. (2-tailed) = .019.</text><text x="43" y="716" font-size="20" fill="#6d7890">4.</text><text x="84" y="716" font-size="23" fill="#22334a">N = 10 for both variables.</text><text x="43" y="769" font-size="20" fill="#6d7890">5.</text><text x="84" y="769" font-size="23" fill="#22334a">The IQ–Maths and Maths–IQ entries are identical.</text><text x="43" y="822" font-size="20" fill="#6d7890">6.</text><text x="84" y="822" font-size="23" fill="#22334a">* Correlation is significant at the 0.05 level (2-tailed).</text></g><text x="43" y="897" font-size="16" fill="#637087">Week 4 · PDF page 21 · clear reading view</text></g></svg>