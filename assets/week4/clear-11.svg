<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="644" viewBox="0 0 1100 644"><rect width="1100" height="644" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Pearson’s correlation coefficient: formula</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">Pearson’s Correlation Coefficient (r)</text><text x="43" y="178" font-size="20" fill="#6d7890">2.</text><text x="84" y="178" font-size="23" fill="#22334a">r = Σ[(xᵢ − x̄)(yᵢ − ȳ)] / √[Σ(xᵢ − x̄)² × Σ(yᵢ − ȳ)²]</text><text x="43" y="231" font-size="20" fill="#6d7890">3.</text><text x="84" y="231" font-size="23" fill="#22334a">r: Sample correlation coefficient.</text><text x="43" y="284" font-size="20" fill="#6d7890">4.</text><text x="84" y="284" font-size="23" fill="#22334a">Σ: Summation, “Take the Sum Of”.</text><text x="43" y="337" font-size="20" fill="#6d7890">5.</text><text x="84" y="337" font-size="23" fill="#22334a">xᵢ: Value of X; x̄: Mean of X variable.</text><text x="43" y="390" font-size="20" fill="#6d7890">6.</text><text x="84" y="390" font-size="23" fill="#22334a">yᵢ: Value of Y; ȳ: Mean of Y variable.</text><text x="43" y="443" font-size="20" fill="#6d7890">7.</text><text x="84" y="443" font-size="23" fill="#22334a">Σ(xᵢ − x̄)²: Sum of the squared deviations for X.</text><text x="43" y="496" font-size="20" fill="#6d7890">8.</text><text x="84" y="496" font-size="23" fill="#22334a">Σ(yᵢ − ȳ)²: Sum of the squared deviations for Y.</text><text x="43" y="549" font-size="20" fill="#6d7890">9.</text><text x="84" y="549" font-size="23" fill="#22334a">√: Square root.</text></g><text x="43" y="624" font-size="16" fill="#637087">Week 4 · PDF page 11 · clear reading view</text></g></svg>