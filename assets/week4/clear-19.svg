<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="341" viewBox="0 0 1100 341"><rect width="1100" height="341" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="43" y="48" font-size="29" fill="#22334a">Pearson example: IQ and mathematics</text><path d="M43 78H1057" stroke="#d8deeb"/><g transform="translate(0 0)"><text x="43" y="125" font-size="20" fill="#6d7890">1.</text><text x="84" y="125" font-size="23" fill="#22334a">A lecturer wants to identify the relationship between IQ and performance in</text><text x="84" y="159" font-size="23" fill="#22334a">a mathematics test among his architecture students.</text><text x="43" y="212" font-size="20" fill="#6d7890">2.</text><text x="84" y="212" font-size="23" fill="#22334a">The IQ scores and the mathematics performance test scores were collected</text><text x="84" y="246" font-size="23" fill="#22334a">from 10 architecture students.</text></g><text x="43" y="321" font-size="16" fill="#637087">Week 4 · PDF page 19 · clear reading view</text></g></svg>