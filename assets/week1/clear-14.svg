<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="559" viewBox="0 0 1100 559"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="559" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Nominal scale</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">Involves placing objects or individuals into mutually exclusive categories.</text><text x="42" y="177" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="177" font-size="23" text-anchor="start" fill="#22334a">Numbers are assigned to the categories for identification purposes only.</text><text x="42" y="234" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="234" font-size="23" text-anchor="start" fill="#22334a">Numbers do not indicate any value or amount.</text><text x="42" y="291" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="291" font-size="23" text-anchor="start" fill="#22334a">Eg: 1: female; 2: male</text><text x="42" y="348" font-size="22" text-anchor="start" fill="#6d7890">5.</text><text x="83" y="348" font-size="23" text-anchor="start" fill="#22334a">1: Chinese; 2: Indian; 3: Malay</text><text x="42" y="405" font-size="22" text-anchor="start" fill="#6d7890">6.</text><text x="83" y="405" font-size="23" text-anchor="start" fill="#22334a">Therefore no addition, subtraction, multiplication, or division is allowed.</text><text x="42" y="462" font-size="22" text-anchor="start" fill="#6d7890">7.</text><text x="83" y="462" font-size="23" text-anchor="start" fill="#22334a">There is a distinction between categories only.</text><text x="45" y="537" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>