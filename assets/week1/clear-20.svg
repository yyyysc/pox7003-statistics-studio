<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1032" viewBox="0 0 1100 1032"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="1032" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Tutorial: measurement scales</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">Indicate which level of measurement is being used in the given scenario.</text><text x="83" y="155" font-size="23" text-anchor="start" fill="#22334a">(Nominal/Ordinal/Interval/Ratio)</text><text x="42" y="212" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">1. The teacher of a class of third graders records the height of each</text><text x="83" y="247" font-size="23" text-anchor="start" fill="#22334a">student.</text><text x="42" y="304" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="304" font-size="23" text-anchor="start" fill="#22334a">2. The teacher of a class of third graders records the eye color of each</text><text x="83" y="339" font-size="23" text-anchor="start" fill="#22334a">student.</text><text x="42" y="396" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="396" font-size="23" text-anchor="start" fill="#22334a">3. The teacher of a class of third graders records the letter grade for</text><text x="83" y="431" font-size="23" text-anchor="start" fill="#22334a">Mathematics for each student.</text><text x="42" y="488" font-size="22" text-anchor="start" fill="#6d7890">5.</text><text x="83" y="488" font-size="23" text-anchor="start" fill="#22334a">4. The teacher of a class of third graders records the percentage that each</text><text x="83" y="523" font-size="23" text-anchor="start" fill="#22334a">student got correct on the last science test.</text><text x="42" y="580" font-size="22" text-anchor="start" fill="#6d7890">6.</text><text x="83" y="580" font-size="23" text-anchor="start" fill="#22334a">5. A meteorologist compiles a list of temperatures in degrees Celsius for</text><text x="83" y="615" font-size="23" text-anchor="start" fill="#22334a">May.</text><text x="42" y="672" font-size="22" text-anchor="start" fill="#6d7890">7.</text><text x="83" y="672" font-size="23" text-anchor="start" fill="#22334a">6. A meteorologist compiles a list of temperatures in degrees Fahrenheit for</text><text x="83" y="707" font-size="23" text-anchor="start" fill="#22334a">May.</text><text x="42" y="764" font-size="22" text-anchor="start" fill="#6d7890">8.</text><text x="83" y="764" font-size="23" text-anchor="start" fill="#22334a">7. A film critic lists the top 50 greatest movies of all time.</text><text x="42" y="821" font-size="22" text-anchor="start" fill="#6d7890">9.</text><text x="83" y="821" font-size="23" text-anchor="start" fill="#22334a">8. A car magazine lists the most expensive cars for 2017.</text><text x="42" y="878" font-size="22" text-anchor="start" fill="#6d7890">10.</text><text x="83" y="878" font-size="23" text-anchor="start" fill="#22334a">9. The roaster basketball team lists jersey numbers for each of the players.</text><text x="42" y="935" font-size="22" text-anchor="start" fill="#6d7890">11.</text><text x="83" y="935" font-size="23" text-anchor="start" fill="#22334a">10. A local animal shelter keeps track of the breeds of dogs that come in.</text><text x="45" y="1010" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>