<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="309" viewBox="0 0 1100 309"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="309" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Mode and nominal data</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">The mode is primarily used with nominally scaled data.</text><text x="42" y="177" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="177" font-size="23" text-anchor="start" fill="#22334a">It is the only measure of central tendency that is appropriate for nominally</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">scaled data.</text><text x="45" y="287" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>