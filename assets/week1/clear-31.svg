<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="366" viewBox="0 0 1100 366"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="366" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Mode: limitations</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">The mode is not a very useful measure of central tendency.</text><text x="42" y="177" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="177" font-size="23" text-anchor="start" fill="#22334a">It is insensitive to large changes in the data set.</text><text x="42" y="234" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="234" font-size="23" text-anchor="start" fill="#22334a">That is, two data sets that are very different from each other can have the</text><text x="83" y="269" font-size="23" text-anchor="start" fill="#22334a">same mode.</text><text x="45" y="344" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>