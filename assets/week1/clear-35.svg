<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="423" viewBox="0 0 1100 423"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="423" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Median example: eleven scores</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">What is the median of the following scores: 10, 8, 14, 15, 7, 3, 3, 8, 12,</text><text x="83" y="155" font-size="23" text-anchor="start" fill="#22334a">10, 9?</text><text x="42" y="212" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">Sort the scores: 15, 14, 12, 10, 10, 9, 8, 8, 7, 3, 3.</text><text x="42" y="269" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="269" font-size="23" text-anchor="start" fill="#22334a">Determine the middle score: middle = (N + 1) / 2 = (11 + 1) / 2 = 6.</text><text x="42" y="326" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="326" font-size="23" text-anchor="start" fill="#22334a">Middle score = median = 9.</text><text x="45" y="401" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>