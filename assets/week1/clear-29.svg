<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="344" viewBox="0 0 1100 344"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="344" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Measures of central tendency</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">A measure of central tendency is a descriptive statistic that describes the</text><text x="83" y="155" font-size="23" text-anchor="start" fill="#22334a">average, or typical value of a set of scores.</text><text x="42" y="212" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">There are three common measures of central tendency: the mode; the median;</text><text x="83" y="247" font-size="23" text-anchor="start" fill="#22334a">the mean.</text><text x="45" y="322" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>