<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="620" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Relations between measures of central tendency</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="550" y="120" font-size="24" text-anchor="middle" fill="#22334a">Read the direction from the tail of the distribution.</text><path d="M65 390L385 390" stroke="#65738c" stroke-width="2" fill="none"/><path d="M75 385 C135 385 145 205 225 205 C305 205 315 385 375 385" fill="none" stroke="#5369a8" stroke-width="4"/><text x="225" y="440" font-size="23" text-anchor="middle" fill="#22334a">Symmetrical / normal</text><text x="225" y="485" font-size="21" text-anchor="middle" fill="#22334a">Mean = median = mode</text><path d="M420 390L740 390" stroke="#65738c" stroke-width="2" fill="none"/><path d="M430 385 C445 155 480 195 525 290 C575 363 655 378 730 385" fill="none" stroke="#5369a8" stroke-width="4"/><text x="580" y="440" font-size="23" text-anchor="middle" fill="#22334a">Positive (right) skew</text><text x="580" y="485" font-size="21" text-anchor="middle" fill="#22334a">Mean usually &gt; median</text><path d="M775 390L1095 390" stroke="#65738c" stroke-width="2" fill="none"/><path d="M785 385 C860 378 940 363 990 290 C1035 195 1070 155 1085 385" fill="none" stroke="#5369a8" stroke-width="4"/><text x="935" y="440" font-size="23" text-anchor="middle" fill="#22334a">Negative (left) skew</text><text x="935" y="485" font-size="21" text-anchor="middle" fill="#22334a">Mean usually &lt; median</text><text x="550" y="560" font-size="20" text-anchor="middle" fill="#22334a">Skew orderings describe common teaching examples, not ever