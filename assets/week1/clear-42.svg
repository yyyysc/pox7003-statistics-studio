<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="493" viewBox="0 0 1100 493"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="493" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Activity 2: children per household</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">In a survey of 10 households, the number of children was found to be: 4, 1,</text><text x="83" y="155" font-size="23" text-anchor="start" fill="#22334a">5, 4, 3, 7, 2, 3, 4, 1.</text><text x="42" y="212" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">(a) State the mode.</text><text x="42" y="269" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="269" font-size="23" text-anchor="start" fill="#22334a">(b) Calculate (i) the mean number of children per household (ii) the median</text><text x="83" y="304" font-size="23" text-anchor="start" fill="#22334a">number of children per household.</text><text x="42" y="361" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="361" font-size="23" text-anchor="start" fill="#22334a">(c) A researcher says: “The mode seems to be the best average to represent</text><text x="83" y="396" font-size="23" text-anchor="start" fill="#22334a">the data in this survey.” Give ONE reason to support this statement.</text><text x="45" y="471" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>