<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="515" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Median: calculation procedure</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">Conceptually, it is easy to calculate the median.</text><text x="42" y="177" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="177" font-size="23" text-anchor="start" fill="#22334a">There are many minor problems that can occur; it is best to let a computer</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">do it.</text><text x="42" y="269" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="269" font-size="23" text-anchor="start" fill="#22334a">Sort the data from highest to lowest.</text><text x="42" y="326" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="326" font-size="23" text-anchor="start" fill="#22334a">Find the score in the middle: middle = (N + 1) / 2.</text><text x="42" y="383" font-size="22" text-anchor="start" fill="#6d7890">5.</text><text x="83" y="383" font-size="23" text-anchor="start" fill="#22334a">If N, the number of scores, is even the median is the average of the middle</text><text x="83" y="418" font-size="23" text-anchor="start" fill="#22334a">two scores.</text><text x="45" y="493" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>