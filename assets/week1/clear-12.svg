<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="855" viewBox="0 0 1100 855"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="855" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Defining data types: numerical data</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><rect x="350" y="110" width="400" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="140" font-size="22" text-anchor="middle" fill="#22334a">Numerical data</text><path d="M550 180L550 235" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="290" y="240" width="520" height="85" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="270" font-size="22" text-anchor="middle" fill="#22334a">Meaningful absolute zero and ratios?</text><text x="550" y="299" font-size="22" text-anchor="middle" fill="#22334a">Original: “relative difference”</text><path d="M290 283L220 390" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="230" y="343" font-size="21" text-anchor="start" fill="#22334a">No</text><rect x="70" y="395" width="300" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="220" y="425" font-size="22" text-anchor="middle" fill="#22334a">Interval data</text><path d="M810 283L880 390" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="864" y="343" font-size="21" text-anchor="start" fill="#22334a">Yes</text><rect x="730" y="395" width="300" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="880" y="425" font-size="22" text-anchor="middle" fill="#22334a">Ratio data</text><path d="M220 465L440 530" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M880 465L660 530" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="310" y="535" width="480" height="85" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="565" font-size="22" text-anchor="middle" fill="#22334a">Can it theoretically take any value</text><text x="550" y="594" font-size="22" text-anchor="middle" fill="#22334a">within a range?</text><path d="M310 577L210 680" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="225" y="628" font-size="21" text-anchor="start" fill="#22334a">Yes</text><rect x="60" y="685" width="300" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="210" y="715" font-size="22" text-anchor="middle" fill="#22334a">Continuous data</text><path d="M790 577L890 680" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="865" y="628" font-size="21" text-anchor="start" fill="#22334a">No</text><rect x="740" y="685" width="300" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="890" y="715" font-size="22" text-anchor="middle" fill="#22334a">Discrete data</text><text x="45" y="805" font-size="22" text-anchor="start" fill="#22334a">Clarification: interval and ratio scales both allow meaningful differences.</text><text x="45" y="833" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>