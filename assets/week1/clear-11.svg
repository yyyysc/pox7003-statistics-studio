<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="745" viewBox="0 0 1100 745"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="745" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Defining data types: categorical data</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><rect x="335" y="110" width="430" height="75" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="140" font-size="22" text-anchor="middle" fill="#22334a">Can the variable be measured</text><text x="550" y="169" font-size="22" text-anchor="middle" fill="#22334a">numerically as a quantity?</text><path d="M550 190L550 245" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="570" y="220" font-size="21" text-anchor="start" fill="#22334a">No</text><rect x="350" y="250" width="400" height="65" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="280" font-size="22" text-anchor="middle" fill="#22334a">Categorical data</text><path d="M550 320L550 380" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="335" y="385" width="430" height="75" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="415" font-size="22" text-anchor="middle" fill="#22334a">More than two categories?</text><path d="M770 422L870 422" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="812" y="400" font-size="21" text-anchor="start" fill="#22334a">No</text><rect x="875" y="385" width="180" height="90" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="965" y="415" font-size="22" text-anchor="middle" fill="#22334a">Dichotomous</text><text x="965" y="444" font-size="22" text-anchor="middle" fill="#22334a">data</text><path d="M550 465L550 535" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="570" y="505" font-size="21" text-anchor="start" fill="#22334a">Yes</text><rect x="335" y="540" width="430" height="75" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="550" y="570" font-size="22" text-anchor="middle" fill="#22334a">Can the categories be ranked?</text><path d="M330 578L215 578" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="263" y="557" font-size="21" text-anchor="start" fill="#22334a">No</text><rect x="45" y="540" width="170" height="85" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="130" y="570" font-size="22" text-anchor="middle" fill="#22334a">Nominal</text><text x="130" y="599" font-size="22" text-anchor="middle" fill="#22334a">data</text><path d="M770 578L875 578" stroke="#6373ad" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="815" y="557" font-size="21" text-anchor="start" fill="#22334a">Yes</text><rect x="880" y="540" width="175" height="85" rx="10" fill="#eef0fc" stroke="#bcc4d8"/><text x="967.5" y="570" font-size="22" text-anchor="middle" fill="#22334a">Ordinal</text><text x="967.5" y="599" font-size="22" text-anchor="middle" fill="#22334a">data</text><text x="45" y="690" font-size="22" text-anchor="start" fill="#22334a">Numeric quantity? Yes → numerical-data flowchart on the next page.</text><text x="45" y="723" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>