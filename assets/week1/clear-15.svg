<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6373ad"/></marker></defs><rect width="1100" height="550" rx="12" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="49" font-size="30" text-anchor="start" fill="#22334a">Ordinal scale</text><path d="M45 72L1055 72" stroke="#d8deeb" stroke-width="2" fill="none"/><text x="42" y="120" font-size="22" text-anchor="start" fill="#6d7890">1.</text><text x="83" y="120" font-size="23" text-anchor="start" fill="#22334a">Ranks objects or individuals according to how much of an attribute they</text><text x="83" y="155" font-size="23" text-anchor="start" fill="#22334a">possess.</text><text x="42" y="212" font-size="22" text-anchor="start" fill="#6d7890">2.</text><text x="83" y="212" font-size="23" text-anchor="start" fill="#22334a">Numbers indicate an order of the categories.</text><text x="42" y="269" font-size="22" text-anchor="start" fill="#6d7890">3.</text><text x="83" y="269" font-size="23" text-anchor="start" fill="#22334a">Neither the difference nor the ratio bears any meaning.</text><text x="42" y="326" font-size="22" text-anchor="start" fill="#6d7890">4.</text><text x="83" y="326" font-size="23" text-anchor="start" fill="#22334a">There is a distinction between categories plus an order among the</text><text x="83" y="361" font-size="23" text-anchor="start" fill="#22334a">categories.</text><text x="42" y="418" font-size="22" text-anchor="start" fill="#6d7890">5.</text><text x="83" y="418" font-size="23" text-anchor="start" fill="#22334a">Their main use is to describe data in order or rank form based on a</text><text x="83" y="453" font-size="23" text-anchor="start" fill="#22334a">particular scale of attributes.</text><text x="45" y="528" font-size="16" text-anchor="start" fill="#637087">Vector reading view · redrawn from the teacher slide</text></g></svg>